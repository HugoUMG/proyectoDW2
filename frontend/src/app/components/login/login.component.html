<div class="login-card">
  <h2>{{ usuarioActual ? 'Panel de usuario' : (modo === 'login' ? 'Iniciar sesión' : 'Crear cuenta') }}</h2>

  <form *ngIf="!usuarioActual" (ngSubmit)="enviar()" novalidate>
    <div class="form-group">
      <label for="username">Usuario</label>
      <input id="username" name="username" type="text" [(ngModel)]="username" [disabled]="cargando" required>
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" [(ngModel)]="password" [disabled]="cargando" required>
    </div>

    <div class="form-group" *ngIf="modo === 'registro'">
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" [(ngModel)]="email" [disabled]="cargando" required>
    </div>

    <button type="submit" [disabled]="cargando">
      {{ modo === 'login' ? 'Ingresar' : 'Registrarme' }}
    </button>

    <button type="button" class="enlace" (click)="alternarModo()" [disabled]="cargando">
      {{ modo === 'login' ? 'Crear una cuenta nueva' : 'Ya tengo cuenta, iniciar sesión' }}
    </button>
  </form>

  <div *ngIf="usuarioActual" class="sesion-activa">
    <p>Sesión activa como <strong>{{ usuarioActual.username }}</strong></p>
    <p class="correo">{{ usuarioActual.email }}</p>
    <button type="button" (click)="cerrarSesion()">Cerrar sesión</button>
  </div>

  <div *ngIf="mensaje" class="alerta" [ngClass]="{'exito': tipoMensaje === 'success', 'error': tipoMensaje === 'error'}">
    {{ mensaje }}
  </div>
</div>
